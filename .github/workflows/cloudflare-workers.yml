name: Cloudflare Workers migration validation

on:
  push:
    branches:
      - migration/cloudflare-workers
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-workers.yml"

permissions:
  contents: write

concurrency:
  group: cloudflare-workers-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install regenerates the lockfile for the newly-added Cloudflare
      # tooling; commit that deterministic lockfile update to this migration branch.
      - name: Install dependencies and synchronize lockfile
        run: npm install --no-audit --no-fund

      - name: Commit updated lockfile when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync lockfile for Cloudflare Workers"
            git push
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Security tests
        run: npm test

      - name: Build Next.js for Cloudflare Workers
        run: npm run cf:build
