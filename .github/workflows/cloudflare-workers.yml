name: Cloudflare Workers migration validation

on:
  push:
    branches:
      - migration/cloudflare-staging-deploy
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/cloudflare-workers.yml"

# Validation only: this workflow must never deploy or modify repository files.
permissions:
  contents: read

concurrency:
  group: cloudflare-workers-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Security tests
        run: npm test

      - name: Build Next.js for Cloudflare Workers
        run: npm run cf:build

      - name: Validate Railway Docker build
        run: docker build --target build -t tikley:ci .
