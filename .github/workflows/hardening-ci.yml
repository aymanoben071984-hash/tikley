name: Security and deployment validation

on:
  push:
    branches:
      - hardening/full-security-operations
      - fix/tiktoklive-blocked-and-ingestion
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tikley_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tikley_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security unit and PostgreSQL concurrency tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/tikley_test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint security surface
        run: npx eslint src/lib/auth.ts src/lib/password.ts src/proxy.ts src/app/login/page.tsx src/app/api/auth src/app/api/events/route.ts src/app/api/quran/route.ts src/app/api/tiktok/ingest/route.ts
      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install worker test dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Worker durable spool restart test
        run: python -m unittest worker.test_event_spool -v
      - name: Python worker syntax
        run: python -m py_compile worker/tiktok_live_worker.py worker/test_event_spool.py
      - name: Docker image build
        run: docker build --pull -t tikley:hardening .
