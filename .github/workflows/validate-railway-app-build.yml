name: Validate Railway app build

on:
  push:
    branches:
      - fix/railway-app-service-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: railway-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, Next.js build, Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Docker image
        run: docker build --pull -t tikley:railway-pr .
